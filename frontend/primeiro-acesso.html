<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./assets/css/styles.css">

    <title>Primeiro Acesso - PRIM 21</title>

    <style>
        body {
            background: #0a0a0a;
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="text-white min-h-screen flex items-center justify-center px-4 fade-in">

<div class="w-full max-w-md bg-neutral-900 border border-neutral-800 rounded-2xl p-10 shadow-prim">

    <div class="flex flex-col items-center mb-8">
        <img src="./assets/img/prim21-logo.png" class="w-20 mb-4">
        <h2 class="text-2xl font-bold text-orange-400">Criar Acesso</h2>
        <p class="text-gray-400 text-center text-sm mt-1">
            Preencha os dados para criar sua conta
        </p>
    </div>

    <div class="space-y-5">
        <div>
            <label class="text-sm text-soft">Nome completo</label>
            <input id="nome" type="text"
                   class="w-full mt-1 p-3 bg-neutral-800 text-white rounded-lg outline-none transition-fast focus:ring-2 focus:ring-orange-500"
                   placeholder="Ex: João da Silva">
        </div>

        <div>
            <label class="text-sm text-soft">E-mail</label>
            <input id="email" type="email"
                   class="w-full mt-1 p-3 bg-neutral-800 text-white rounded-lg outline-none transition-fast focus:ring-2 focus:ring-orange-500"
                   placeholder="Digite seu e-mail">
        </div>

        <div>
            <label class="text-sm text-soft">Senha</label>
            <input id="senha" type="password"
                   class="w-full mt-1 p-3 bg-neutral-800 text-white rounded-lg outline-none transition-fast focus:ring-2 focus:ring-orange-500"
                   placeholder="Crie uma senha">
        </div>

        <div>
            <label class="text-sm text-soft">Confirmar senha</label>
            <input id="confirmar" type="password"
                   class="w-full mt-1 p-3 bg-neutral-800 text-white rounded-lg outline-none transition-fast focus:ring-2 focus:ring-orange-500"
                   placeholder="Repita a senha">
        </div>

        <button onclick="registrar()"
                class="btn-orange w-full py-3 rounded-lg font-semibold mt-4 text-white shadow-prim">
            Criar Conta
        </button>

        <p id="msg" class="text-center mt-2 hidden"></p>
    </div>

    <div class="text-center mt-8">
        <a href="login.html" class="text-orange-400 hover:text-orange-300 font-semibold transition-fast">
            Já tenho acesso →
        </a>
    </div>

</div>

<script src="./js/api.js"></script>
<script src="./js/primeiro-acesso.js"></script>

</body>
</html>
