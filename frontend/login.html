<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./assets/css/styles.css">

    <title>Login - PRIM 21</title>

    <style>
        body {
            background: #0a0a0a;
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="text-white min-h-screen flex items-center justify-center px-4 fade-in">

<div class="w-full max-w-md bg-neutral-900 border border-neutral-800 rounded-2xl p-10 shadow-prim">

    <!-- LOGO -->
    <div class="flex flex-col items-center mb-8">
        <img src="./assets/img/prim21-logo.png" class="w-24 mb-4">
        <h2 class="text-2xl font-bold text-orange-400 tracking-wide">
            Acesso à Plataforma
        </h2>
    </div>

    <!-- CAMPOS -->
    <div class="space-y-5">
        <div>
            <label class="text-sm text-soft">E-mail</label>
            <input id="email" type="email"
                   class="w-full mt-1 p-3 bg-neutral-800 text-white rounded-lg outline-none transition-fast focus:ring-2 focus:ring-orange-500"
                   placeholder="Digite seu e-mail">
        </div>

        <div>
            <label class="text-sm text-soft">Senha</label>
            <input id="senha" type="password"
                   class="w-full mt-1 p-3 bg-neutral-800 text-white rounded-lg outline-none transition-fast focus:ring-2 focus:ring-orange-500"
                   placeholder="Digite sua senha">
        </div>

        <button onclick="login()"
                class="btn-orange w-full py-3 rounded-lg font-semibold mt-4 text-white shadow-prim">
            Entrar
        </button>

        <p id="error" class="text-red-400 text-center mt-2 hidden"></p>
    </div>
    <div class="text-center mt-8">
        <p class="text-gray-400 mb-2">Ainda não possui acesso?</p>

        <a href="#" class="text-orange-400 hover:text-orange-300 font-semibold transition-fast">
            Criar primeiro acesso →
        </a>
    </div>

</div>

<script src="./js/api.js"></script>
<script src="./js/auth.js"></script>

</body>
</html>
