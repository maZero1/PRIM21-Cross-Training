<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../assets/css/styles.css">

    <title>Vencimentos | PRIM 21</title>

    <style>
        body {
            background: #050505;
            font-family: 'Inter', sans-serif;
        }

        .status-green { color: #4ade80; font-weight: 600; }
        .status-yellow { color: #facc15; font-weight: 600; }
        .status-red { color: #f87171; font-weight: 600; }
    </style>
</head>

<body class="text-white min-h-screen flex">

<!-- SIDEBAR -->
<aside class="w-64 bg-neutral-950 border-r border-neutral-800 flex flex-col">
    <div class="flex items-center gap-3 px-5 py-4 border-b border-neutral-800">
        <img src="../assets/img/prim21-logo.png" class="w-10">
        <div>
            <p class="text-xs text-gray-400">Administração</p>
            <h1 class="text-lg font-bold text-orange-400">PRIM 21</h1>
        </div>
    </div>

    <nav class="flex-1 px-4 py-4 space-y-1 text-sm">
        <a href="../admin-dashboard.html" class="block px-3 py-2 rounded-lg hover:bg-neutral-800">Dashboard</a>
        <a href="./cadastrar-aluno.html" class="block px-3 py-2 rounded-lg hover:bg-neutral-800">Cadastrar aluno</a>
        <a href="./atualizar-aluno.html" class="block px-3 py-2 rounded-lg hover:bg-neutral-800">Atualizar aluno</a>
        <a href="./horarios.html" class="block px-3 py-2 rounded-lg hover:bg-neutral-800">Agenda / Horários</a>
        <button class="w-full text-left px-3 py-2 rounded-lg bg-neutral-800 text-orange-300">Vencimentos</button>
        <a href="./reposicao.html" class="block px-3 py-2 rounded-lg hover:bg-neutral-800">Reposição de aula</a>
    </nav>

    <div class="px-4 py-4 border-t border-neutral-800">
        <button onclick="logout()" class="w-full py-2 bg-red-600 hover:bg-red-700 rounded-lg text-sm">
            Sair
        </button>
    </div>
</aside>

<!-- CONTEÚDO -->
<main class="flex-1 p-10 fade-in max-w-5xl mx-auto">

    <h2 class="title-main mb-6">Controle de vencimentos</h2>

    <!-- FILTROS -->
    <div class="flex gap-4 mb-6">
        <button onclick="filtrar('todos')" class="px-4 py-2 bg-neutral-800 rounded-lg hover:bg-neutral-700">Todos</button>
        <button onclick="filtrar('proximos')" class="px-4 py-2 bg-yellow-600 rounded-lg hover:bg-yellow-500">Próximos</button>
        <button onclick="filtrar('atrasados')" class="px-4 py-2 bg-red-600 rounded-lg hover:bg-red-500">Atrasados</button>
    </div>

    <!-- TABELA -->
    <div class="treino-card shadow-prim overflow-hidden">
        <table class="w-full text-sm">
            <thead class="bg-neutral-800 text-gray-400 text-left">
            <tr>
                <th class="p-3">Aluno</th>
                <th class="p-3">Plano</th>
                <th class="p-3">Vencimento</th>
                <th class="p-3">Status</th>
                <th class="p-3">Ação</th>
            </tr>
            </thead>
            <tbody id="lista-vencimentos" class="text-white"></tbody>
        </table>
    </div>

</main>

<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>

<script>
    let listaOriginal = [];

    document.addEventListener("DOMContentLoaded", carregarMensalidades);

    function carregarMensalidades() {
        apiGet("/mensalidades", true).then(lista => {
            listaOriginal = lista;
            renderTabela(lista);
        });
    }

    function filtrar(tipo) {
        if (tipo === "todos") return renderTabela(listaOriginal);

        const hoje = new Date();

        const filtrados = listaOriginal.filter(m => {
            const data = new Date(m.vencimento);

            if (tipo === "proximos") {
                return data >= hoje && (data - hoje) < 4 * 86400000;
            }

            if (tipo === "atrasados") {
                return data < hoje;
            }
        });

        renderTabela(filtrados);
    }

    function renderTabela(lista) {
        const tbody = document.getElementById("lista-vencimentos");
        tbody.innerHTML = "";

        lista.forEach(m => {
            const status = calcularStatus(m.vencimento);

            tbody.innerHTML += `
                <tr class="border-t border-neutral-800">
                    <td class="p-3">${m.aluno.nome}</td>
                    <td class="p-3">${m.plano}</td>
                    <td class="p-3">${formatarData(m.vencimento)}</td>
                    <td class="p-3 ${status.classe}">${status.texto}</td>
                    <td class="p-3">
                        <button onclick="pago(${m.id})"
                                class="btn-orange text-xs px-3 py-1 rounded-lg">
                            Marcar como pago
                        </button>
                    </td>
                </tr>
            `;
        });
    }

    function calcularStatus(dataStr) {
        const hoje = new Date();
        const data = new Date(dataStr);

        if (data < hoje) return { texto: "Atrasado", classe: "status-red" };

        const dias = (data - hoje) / 86400000;
        if (dias <= 3) return { texto: "Vence em breve", classe: "status-yellow" };

        return { texto: "Em dia", classe: "status-green" };
    }

    function pago(id) {
        apiPost(`/mensalidades/${id}/pagar`, {}, true).then(() => {
            carregarMensalidades();
        });
    }

    function formatarData(d) {
        return new Date(d).toLocaleDateString("pt-BR");
    }
</script>

</body>
</html>
