<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../../../../../frontend/assets/css/styles.css">
    <title>Cadastrar Aluno | PRIM 21</title>

    <style>
        body {
            background: #050505;
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="text-white min-h-screen flex">

<!-- SIDEBAR -->
<aside class="w-64 bg-neutral-950 border-r border-neutral-800 flex flex-col">
    <div class="flex items-center gap-3 px-5 py-4 border-b border-neutral-800">
        <img src="../../../../../frontend/assets/img/prim21-logo.png" class="w-10">
        <div>
            <p class="text-xs text-gray-400">Administração</p>
            <h1 class="text-lg font-bold text-orange-400">PRIM 21</h1>
        </div>
    </div>

    <nav class="flex-1 px-4 py-4 space-y-1 text-sm">
        <a href="../../../../../frontend/admin-dashboard.html" class="block px-3 py-2 rounded-lg hover:bg-neutral-800">Dashboard</a>
        <button class="w-full text-left px-3 py-2 rounded-lg bg-neutral-800 text-orange-300">Cadastrar aluno</button>
        <a href="atualizar-aluno.html" class="block px-3 py-2 rounded-lg hover:bg-neutral-800">Atualizar aluno</a>
        <a href="horarios.html" class="block px-3 py-2 rounded-lg hover:bg-neutral-800">Agenda / Horários</a>
        <a href="vencimentos.html" class="block px-3 py-2 rounded-lg hover:bg-neutral-800">Vencimentos</a>
        <a href="reposicao.html" class="block px-3 py-2 rounded-lg hover:bg-neutral-800">Reposição de aula</a>
    </nav>

    <div class="px-4 py-4 border-t border-neutral-800">
        <button onclick="logout()" class="w-full py-2 bg-red-600 hover:bg-red-700 rounded-lg text-sm">
            Sair
        </button>
    </div>
</aside>

<!-- CONTEÚDO -->
<main class="flex-1 p-10 fade-in max-w-3xl mx-auto">

    <h2 class="title-main mb-6">Cadastrar aluno</h2>

    <div class="treino-card shadow-prim p-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">

            <div>
                <label class="text-sm text-soft">Nome completo</label>
                <input id="nome" type="text"
                       class="input-base"
                       placeholder="Digite o nome do aluno">
            </div>

            <div>
                <label class="text-sm text-soft">E-mail</label>
                <input id="email" type="email"
                       class="input-base"
                       placeholder="email@exemplo.com">
            </div>

            <div>
                <label class="text-sm text-soft">Telefone</label>
                <input id="telefone" type="text"
                       class="input-base"
                       placeholder="(00) 00000-0000">
            </div>

            <div>
                <label class="text-sm text-soft">Plano</label>
                <select id="plano" class="input-base">
                    <option value="">Selecione</option>
                    <option value="MENSAL">Mensal</option>
                    <option value="SEMANAL">Semanal</option>
                </select>
            </div>

            <div>
                <label class="text-sm text-soft">Horário</label>
                <select id="horario" class="input-base">
                    <option value="">Selecione</option>
                    <!-- será preenchido via API -->
                </select>
            </div>

            <div>
                <label class="text-sm text-soft">Data de início</label>
                <input id="inicio" type="date"
                       class="input-base">
            </div>
        </div>

        <div class="mt-6">
            <label class="text-sm text-soft">Observações</label>
            <textarea id="observacoes" class="input-base h-28"
                      placeholder="Anotações importantes do aluno"></textarea>
        </div>

        <button onclick="cadastrarAluno()"
                class="btn-orange px-6 py-3 rounded-lg mt-6">
            Salvar aluno
        </button>

        <p id="msg" class="mt-4 hidden"></p>
    </div>
</main>

<script src="../../../../../frontend/js/api.js"></script>
<script src="../../../../../frontend/js/auth.js"></script>
<script>
    function cadastrarAluno() {
        const aluno = {
            nome: document.getElementById("nome").value,
            email: document.getElementById("email").value,
            telefone: document.getElementById("telefone").value,
            plano: document.getElementById("plano").value,
            horarioId: document.getElementById("horario").value,
            inicio: document.getElementById("inicio").value,
            observacoes: document.getElementById("observacoes").value
        };

        apiPost("/alunos", aluno, true).then(r => {
            const msg = document.getElementById("msg");
            msg.classList.remove("hidden");

            if (r.sucesso) {
                msg.className = "text-green-400";
                msg.textContent = "Aluno cadastrado com sucesso!";
            } else {
                msg.className = "text-red-400";
                msg.textContent = r.mensagem || "Erro ao cadastrar.";
            }
        });
    }
</script>

</body>
</html>
