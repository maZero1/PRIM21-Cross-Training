<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../../../../../frontend/assets/css/styles.css">
    <title>Gerenciar Horários | PRIM 21</title>

    <style>
        body {
            background: #050505;
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="text-white min-h-screen flex">

<!-- SIDEBAR -->
<aside class="w-64 bg-neutral-950 border-r border-neutral-800 flex flex-col">
    <div class="flex items-center gap-3 px-5 py-4 border-b border-neutral-800">
        <img src="../../../../../frontend/assets/img/prim21-logo.png" class="w-10">
        <div>
            <p class="text-xs text-gray-400">Administração</p>
            <h1 class="text-lg font-bold text-orange-400">PRIM 21</h1>
        </div>
    </div>

    <nav class="flex-1 px-4 py-4 space-y-1 text-sm">
        <a href="../../../../../frontend/admin-dashboard.html" class="block px-3 py-2 rounded-lg hover:bg-neutral-800">Dashboard</a>
        <a href="cadastrar-aluno.html" class="block px-3 py-2 rounded-lg hover:bg-neutral-800">Cadastrar aluno</a>
        <a href="atualizar-aluno.html" class="block px-3 py-2 rounded-lg hover:bg-neutral-800">Atualizar aluno</a>
        <button class="w-full text-left px-3 py-2 rounded-lg bg-neutral-800 text-orange-300">Agenda / Horários</button>
        <a href="vencimentos.html" class="block px-3 py-2 rounded-lg hover:bg-neutral-800">Vencimentos</a>
        <a href="reposicao.html" class="block px-3 py-2 rounded-lg hover:bg-neutral-800">Reposição de aula</a>
    </nav>

    <div class="px-4 py-4 border-t border-neutral-800">
        <button onclick="logout()" class="w-full py-2 bg-red-600 hover:bg-red-700 rounded-lg text-sm">
            Sair
        </button>
    </div>
</aside>

<!-- CONTEÚDO -->
<main class="flex-1 p-10 fade-in max-w-5xl mx-auto">

    <h2 class="title-main mb-6">Gerenciar horários</h2>

    <button onclick="abrirModalNovo()" class="btn-orange px-4 py-2 rounded-lg mb-6">
        + Novo horário
    </button>

    <!-- TABELA -->
    <div class="treino-card shadow-prim overflow-hidden">
        <table class="w-full text-sm">
            <thead class="bg-neutral-800 text-gray-400 text-left">
            <tr>
                <th class="p-3">Horário</th>
                <th class="p-3">Capacidade</th>
                <th class="p-3">Ações</th>
            </tr>
            </thead>
            <tbody id="lista-horarios" class="text-white"></tbody>
        </table>
    </div>

</main>

<!-- MODAL NOVO / EDITAR -->
<div id="modal-horario" class="hidden fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center">
    <div class="bg-neutral-900 p-8 rounded-xl w-full max-w-lg shadow-prim">

        <h3 id="titulo-modal" class="text-xl font-bold text-orange-400 mb-4">Novo horário</h3>

        <div class="space-y-4">
            <div>
                <label class="text-sm text-soft">Horário</label>
                <input id="horario-hora" type="time" class="input-base">
            </div>

            <div>
                <label class="text-sm text-soft">Capacidade</label>
                <input id="horario-capacidade" type="number" min="1" class="input-base">
            </div>
        </div>

        <div class="flex gap-3 mt-6">
            <button onclick="salvarHorario()" class="btn-orange px-4 py-2 rounded-lg">Salvar</button>
            <button onclick="fecharModal()" class="px-4 py-2 bg-neutral-700 rounded-lg">Cancelar</button>
        </div>

    </div>
</div>

<script src="../../../../../frontend/js/api.js"></script>
<script src="../../../../../frontend/js/auth.js"></script>

<script>
    let horarioAtual = null;

    document.addEventListener("DOMContentLoaded", carregarHorarios);

    function carregarHorarios() {
        apiGet("/horarios", true).then(lista => {
            const tbody = document.getElementById("lista-horarios");
            tbody.innerHTML = "";

            lista.forEach(h => {
                tbody.innerHTML += `
                    <tr class="border-t border-neutral-800">
                        <td class="p-3">${h.hora}</td>
                        <td class="p-3">${h.capacidade}</td>
                        <td class="p-3 flex gap-3">
                            <button class="text-orange-400 hover:text-orange-300" onclick='editar(${JSON.stringify(h)})'>Editar</button>
                            <button class="text-red-500 hover:text-red-400" onclick="excluir(${h.id})">Excluir</button>
                        </td>
                    </tr>
                `;
            });
        });
    }

    function abrirModalNovo() {
        horarioAtual = null;
        document.getElementById("titulo-modal").innerText = "Novo horário";
        document.getElementById("horario-hora").value = "";
        document.getElementById("horario-capacidade").value = "";
        document.getElementById("modal-horario").classList.remove("hidden");
    }

    function editar(h) {
        horarioAtual = h;
        document.getElementById("titulo-modal").innerText = "Editar horário";
        document.getElementById("horario-hora").value = h.hora;
        document.getElementById("horario-capacidade").value = h.capacidade;
        document.getElementById("modal-horario").classList.remove("hidden");
    }

    function fecharModal() {
        document.getElementById("modal-horario").classList.add("hidden");
    }

    function salvarHorario() {
        const body = {
            hora: document.getElementById("horario-hora").value,
            capacidade: document.getElementById("horario-capacidade").value
        };

        const endpoint = horarioAtual
            ? `/horarios/${horarioAtual.id}`
            : `/horarios`;

        apiPost(endpoint, body, true).then(() => {
            fecharModal();
            carregarHorarios();
        });
    }

    function excluir(id) {
        if (!confirm("Tem certeza que deseja excluir este horário?")) return;
        apiPost(`/horarios/${id}/delete`, {}, true).then(() => carregarHorarios());
    }
</script>

</body>
</html>
