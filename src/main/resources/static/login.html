<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/css/styles.css">

    <title>Login - PRIM 21</title>

    <style>
        body {
            background: #0a0a0a;
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="text-white min-h-screen flex items-center justify-center px-4 fade-in">

<div class="w-full max-w-md bg-neutral-900 border border-neutral-800 rounded-2xl p-10 shadow-prim">

    <!-- LOGO / TÍTULO -->
    <div class="flex flex-col items-center mb-8">
        <img src="assets/img/prim21-logo.png" class="w-24 mb-4">
        <h2 class="text-2xl font-bold text-orange-400 tracking-wide">
            Acesso à Plataforma
        </h2>
        <p class="text-gray-400 text-sm mt-1 text-center">
            Selecione o tipo de acesso e entre com suas credenciais.
        </p>
    </div>

    <!-- TIPO DE ACESSO -->
    <div class="flex mb-6 bg-neutral-800 rounded-xl p-1">
        <button id="btn-admin"
                class="w-1/2 py-2 rounded-lg text-sm font-semibold bg-orange-500 transition-fast"
                onclick="selecionarTipo('ADMIN')">
            Administrador
        </button>
        <button id="btn-aluno"
                class="w-1/2 py-2 rounded-lg text-sm font-semibold text-gray-300 transition-fast"
                onclick="selecionarTipo('ALUNO')">
            Aluno
        </button>
    </div>

    <!-- CAMPOS -->
    <div class="space-y-5">
        <div>
            <label class="text-sm text-soft">E-mail</label>
            <input id="email" type="email"
                   class="w-full mt-1 p-3 bg-neutral-800 text-white rounded-lg outline-none transition-fast focus:ring-2 focus:ring-orange-500"
                   placeholder="Digite seu e-mail">
        </div>

        <div>
            <label class="text-sm text-soft">Senha</label>
            <input id="senha" type="password"
                   class="w-full mt-1 p-3 bg-neutral-800 text-white rounded-lg outline-none transition-fast focus:ring-2 focus:ring-orange-500"
                   placeholder="Digite sua senha">
        </div>

        <button onclick="login()"
                class="btn-orange w-full py-3 rounded-lg font-semibold mt-4 text-white shadow-prim">
            Entrar
        </button>

        <p id="error" class="text-red-400 text-center mt-2 hidden"></p>
    </div>

    <!-- INFO -->
    <div class="text-center mt-8 text-xs text-gray-500">
        <p>Acesso de administrador: gerenciamento de alunos, horários e vencimentos.</p>
        <p>Acesso de aluno: visualização de horários e reposições.</p>
    </div>

</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>

</body>
</html>
